[package]
name = "samm-router"
version = "0.1.0"
edition = "2021"
description = "SAMM on-chain router — automatic best-shard selection, c-non-splitting enforcement, multi-hop CPI"

[lib]
crate-type = ["cdylib", "lib"]
name = "samm_router"

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "2.0.0"

[dev-dependencies]
solana-program-test = "2.0.0"
solana-sdk = "2.0.0"
