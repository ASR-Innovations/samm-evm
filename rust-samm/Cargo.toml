[package]
name = "samm-math"
version = "0.1.0"
edition = "2021"
description = "Standalone SAMM math library — ported from spl-samm Solana implementation"

[[bin]]
name = "samm"
path = "src/main.rs"

[lib]
name = "samm_math"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
