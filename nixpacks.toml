[phases.setup]
nixPkgs = ['nodejs_20', 'rustc', 'cargo', 'pkg-config', 'openssl']

[phases.install]
cmds = [
  'npm install --production',
]

[phases.build]
cmds = [
  'cd rust-samm && cargo build --release',
  'ls -la rust-samm/target/release/ || echo "Build directory not found"',
  'test -f rust-samm/target/release/samm && echo "✓ Rust binary built successfully" || echo "✗ Rust binary NOT found"',
]

[start]
cmd = 'node api-server.js'
