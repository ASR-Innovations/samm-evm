[phases.setup]
nixPkgs = ['nodejs_20', 'rustc', 'cargo', 'pkg-config', 'openssl', 'gcc']

[phases.install]
cmds = [
  'npm install --production',
]

[phases.build]
cmds = [
  'cd rust-samm && cargo build --release',
  'ls -la target/release/',
  'mkdir -p rust-samm/target/release',
  'cp target/release/samm rust-samm/target/release/samm',
  'ls -la rust-samm/target/release/samm',
  'test -f rust-samm/target/release/samm && echo "✓ Rust binary copied to rust-samm/target/release/samm" || (echo "✗ Binary NOT found" && exit 1)',
]

[start]
cmd = 'node api-server.js'
